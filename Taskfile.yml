version: "3"

tasks:
  # general
  default:
    desc: List available tasks
    cmds:
      - task --list-all
    silent: true
  build:
    desc: Build ./bin/lore (exercises the real go-build path)
    cmds:
      - go build -o ./bin/lore ./cmd/lore
  clean:
    desc: Remove ./bin
    cmds:
      - rm -rf ./bin

  # dev setup (to add the lore-dev command, which itself is actually a script)
  setup:
    desc: Install ~/.local/bin/lore-dev (idempotent; re-run after moving the repo)
    cmds:
      - mkdir -p "$HOME/.local/bin"
      - |
        cat > "$HOME/.local/bin/lore-dev" <<'EOF'
        #!/usr/bin/env bash
        # regenerated by 'task setup' in the lore repo at {{.ROOT_DIR}}
        # re-run 'task setup' from the lore repo if you move it.
        repo={{.ROOT_DIR}}
        if [ ! -d "$repo" ]; then
          echo "lore-dev: repo not found at $repo" >&2
          echo "  re-run 'task setup' from the lore repo to fix." >&2
          exit 1
        fi
        exec go run -C "$repo" ./cmd/lore "$@"
        EOF
      - chmod +x "$HOME/.local/bin/lore-dev"
      - |
        case ":$PATH:" in
          *":$HOME/.local/bin:"*) ;;
          *) echo "warning: $HOME/.local/bin is not on \$PATH; add it to use lore-dev" >&2 ;;
        esac

  # code quality
  check:
    desc: Run all code quality checks
    cmds:
      - task: lint
      - task: test
      - task: release:check
  lint:
    desc: Run golangci-lint with default linter set
    cmds:
      - golangci-lint run
  test:
    desc: Run the Go test suite
    cmds:
      - go test ./...

  # release validation
  release:check:
    desc: Validate the GoReleaser configuration
    cmds:
      - goreleaser check
  release:prepare:
    desc: Check, build, and tag a release without publishing it
    requires:
      vars:
        - VERSION
    env:
      LORE_RELEASE_VERSION: "{{.VERSION}}"
    cmds:
      - ./scripts/release.sh prepare "$LORE_RELEASE_VERSION"
  release:publish:
    desc: Push a prepared release tag and start publication
    requires:
      vars:
        - VERSION
    env:
      LORE_RELEASE_VERSION: "{{.VERSION}}"
    cmds:
      - ./scripts/release.sh publish "$LORE_RELEASE_VERSION"
  release:validate-tag:
    desc: Validate an annotated release tag before pushing it
    requires:
      vars:
        - TAG
    cmds:
      - ./scripts/validate-release-tag.sh "{{.TAG}}"
  release:snapshot:
    desc: Build an unpublished release snapshot in ./dist
    cmds:
      - goreleaser release --snapshot --clean

  # manual smoke testing
  smoke:picker-reset:
    desc: Reset the gitignore-picker smoke sandbox
    cmds:
      - ./scripts/smoke-picker-reset.sh
