version: 2

project_name: lore

builds:
  - main: ./cmd/lore
    binary: lore
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X {{ .ModulePath }}/internal/version.releaseVersion={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # the smoke workflow finds archives by this exact name, so keep the two in step
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github-native

release:
  draft: true
  prerelease: auto
  header: |
    Lore {{ .Tag }} keeps personal agent context in a private central repository
    while projects retain normal local files.
