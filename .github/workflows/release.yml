name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GORELEASER_VERSION: v2.17.1

jobs:
  build:
    name: build draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # runs before the toolchain setup so a rejected tag costs nothing
      - name: validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/validate-release-tag.sh "$RELEASE_TAG"
      - name: set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.12
      - name: run tests
        run: go test ./...
      - name: validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: check
      - name: build draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: upload release candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidates
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: smoke
    needs: build
    uses: ./.github/workflows/smoke.yml
    with:
      artifact-name: release-candidates
      expected-version: ${{ github.ref_name }}

  publish:
    name: attest and publish release
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: download release checksums
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidates
          path: dist
      - name: attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          # gh resolves the target repo from git remotes, and this job has no
          # checkout, so it must be named explicitly or the publish step fails
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
